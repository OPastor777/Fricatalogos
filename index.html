<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Rápido de Preços e Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>body { background-color: #f8fafc; }</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const IconFileText = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
        const IconUpload = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconLoader2 = () => <svg className="w-full h-full animate-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>;
        const IconSearch = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconReceipt = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>;
        const IconImage = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
        const IconInfo = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
        const IconAlertCircle = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const IconAlertTriangle = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        const IconWhatsApp = () => <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>;

        const App = () => {
            const [products, setProducts] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [pdfJsReady, setPdfJsReady] = useState(false);
            const [error, setError] = useState('');
            
            const [activeTab, setActiveTab] = useState('tabela');
            const [orderSummary, setOrderSummary] = useState(null);
            const [isAnalyzingOrder, setIsAnalyzingOrder] = useState(false);
            const [orderError, setOrderError] = useState('');
            const [orderText, setOrderText] = useState('');

            useEffect(() => {
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    setPdfJsReady(true);
                }
            }, []);

            const parsePrice = (priceStr) => {
                if (!priceStr) return null;
                let cleanStr = priceStr;
                if (cleanStr.includes('.') && cleanStr.includes(',')) {
                    cleanStr = cleanStr.replace(/\./g, '').replace(',', '.');
                } else if (cleanStr.includes(',')) {
                    cleanStr = cleanStr.replace(',', '.');
                }
                const val = parseFloat(cleanStr);
                return isNaN(val) ? null : val;
            };

            const formatPrice = (value) => {
                if (value === null || value === undefined) return 'R$ 0,00';
                return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') {
                    setError('Por favor, selecione um arquivo PDF válido.');
                    return;
                }

                setIsLoading(true);
                setError('');
                setProducts([]);

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedProducts = [];

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        
                        const linesMap = new Map();
                        textContent.items.forEach(item => {
                            const y = Math.round(item.transform[5] / 4) * 4; 
                            if (!linesMap.has(y)) linesMap.set(y, []);
                            linesMap.get(y).push(item);
                        });

                        const sortedY = Array.from(linesMap.keys()).sort((a, b) => b - a);

                        sortedY.forEach(y => {
                            const lineItems = linesMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
                            const lineText = lineItems.map(item => item.str).join(' ').replace(/\s+/g, ' ').trim();

                            const match = lineText.match(/(?:^|\s)(\d{4,7})\s+([A-Z0-9ÇÃÕÁÉÍÓÚÂÊÔ].*)/i);
                            if (match) {
                                const code = match[1];
                                let rest = match[2].trim();
                                let rawPriceStr = null;

                                rest = rest.replace(/\s+(?:UN|KG|CX|PC|PCT|BD|PLT|FD|KL|KIL|L|K|KgL|Kg|IN|F|Th|M)\s*$/gi, '').trim();
                                
                                // CORREÇÃO: Procura obrigatoriamente valores monetários (com decimais), impedindo que pesos (ex: "20Kg") virem preço
                                const priceMatches = [...rest.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}|\d+\.\d{2})/g)];
                                
                                if (priceMatches.length > 0) {
                                    // Pega o último valor numérico encontrado na linha (A Vista)
                                    rawPriceStr = priceMatches[priceMatches.length - 1][1];
                                    rest = rest.replace(priceMatches[priceMatches.length - 1][0], '').trim();
                                }

                                const rawPrice = parsePrice(rawPriceStr);
                                const discountPrice = rawPrice !== null ? rawPrice * 0.97 : null;

                                extractedProducts.push({
                                    code, name: rest, originalPrice: rawPrice, discountedPrice: discountPrice
                                });
                            }
                        });
                    }
                    setProducts(extractedProducts);
                    alert(`Sucesso! ${extractedProducts.length} produtos carregados na tabela.`);
                } catch (err) {
                    console.error(err);
                    setError('Ocorreu um erro ao processar o PDF. Tente novamente.');
                } finally {
                    setIsLoading(false);
                }
            };

            const fileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            const processOrderItems = (aiExtractedItems) => {
                return aiExtractedItems.map(aiItem => {
                    const aiCode = (aiItem.code || '').toString().trim();
                    const qty = parseFloat(aiItem.quantity) || 1;
                    const unit = aiItem.unit || 'UN';
                    
                    // Busca o produto real na tabela carregada pelo usuário
                    const realProduct = products.find(p => p.code === aiCode);
                    
                    if (!realProduct) {
                        return {
                            code: aiCode,
                            name: aiItem.name || 'Produto não achou no PDF',
                            quantity: qty,
                            unit: unit,
                            unitOriginalPrice: 0,
                            unitFinalPrice: 0,
                            originalPrice: 0,
                            discountedPrice: 0,
                            hasDiscount: false,
                            notFound: true
                        };
                    }

                    const originalPrice = parseFloat(realProduct.originalPrice) || 0;
                    const nameStr = realProduct.name.toLowerCase().trim();
                    
                    let hasDiscount = true;
                    if (aiCode.startsWith('16') || aiCode.startsWith('27') || aiCode.startsWith('90')) hasDiscount = false;
                    if (nameStr.includes('fraldinha ramax')) hasDiscount = false;

                    // CORREÇÃO: Matemática exata. Se tiver desconto, multiplica por 0.97 e arredonda cravado os centavos
                    let unitFinalPrice = originalPrice;
                    if (hasDiscount) {
                        unitFinalPrice = Math.round((originalPrice * 0.97) * 100) / 100;
                    }
                    
                    return {
                        code: aiCode,
                        name: realProduct.name,
                        quantity: qty,
                        unit: unit,
                        unitOriginalPrice: originalPrice,
                        unitFinalPrice: unitFinalPrice,
                        originalPrice: originalPrice * qty,
                        discountedPrice: unitFinalPrice * qty,
                        hasDiscount: hasDiscount,
                        notFound: false
                    };
                });
            };

            const generateWhatsAppText = () => {
                if (!orderSummary) return '';
                let txt = '';
                if (orderSummary.customerCode && orderSummary.customerCode !== 'Não identificado') {
                    txt += `cliente: ${orderSummary.customerCode}\n`;
                }
                if (orderSummary.spamov) {
                    txt += `spamov: ${orderSummary.spamov}\n`;
                }
                
                if (txt !== '') txt += '\n'; // Adiciona uma linha em branco separando o cabeçalho dos itens
                
                orderSummary.items.forEach(item => {
                    const priceStr = formatPrice(item.unitFinalPrice);
                    // Formato super resumido: 1602 - 3 - R$ 22,00
                    txt += `${item.code} - ${item.quantity} - ${priceStr}\n`;
                });
                return txt.trim();
            };

            const handleCopyWhatsApp = () => {
                const text = generateWhatsAppText();
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('Resumo copiado com sucesso! Agora é só colar no WhatsApp.');
                } catch (err) {
                    console.error('Falha ao copiar', err);
                }
                document.body.removeChild(textArea);
            };

            const handleProcessText = () => {
                if (products.length === 0) {
                    setOrderError('Por favor, carregue o PDF de preços (na aba "Consulta de Preços") ANTES de processar o pedido.');
                    return;
                }
                if (!orderText.trim()) {
                    setOrderError('Cole o texto do pedido na caixa acima.');
                    return;
                }

                setOrderError('');
                setIsAnalyzingOrder(true);
                setOrderSummary(null);

                // Pequeno delay para a interface não travar
                setTimeout(() => {
                    try {
                        const lines = orderText.split('\n');
                        let extractedItems = [];
                        let customerName = 'Não identificado';
                        let spamov = '';

                        // Extrai SPAmov se houver
                        const spMatch = orderText.match(/SPAmov\s*[:\-]?\s*(\d+)/i);
                        if (spMatch) spamov = spMatch[1];

                        // Melhorado: pega apenas o CÓDIGO NUMÉRICO do cliente, ignorando nomes
                        const clienteMatchERP = orderText.match(/CLIENTE\s*(?:\[[^\]]*\])?\s*(\d+)/i);
                        const clienteMatchNormal = orderText.match(/(?:cliente|código|codigo)[:\-\s]+(\d+)/i);
                        
                        if (clienteMatchERP) {
                            customerName = clienteMatchERP[1].trim();
                        } else if (clienteMatchNormal) {
                            customerName = clienteMatchNormal[1].trim();
                        } else {
                            const fallbackCliente = orderText.match(/CLIENTE.*?(\d{4,6})/i);
                            if (fallbackCliente) customerName = fallbackCliente[1];
                        }

                        lines.forEach(line => {
                            // Ignora linhas de cabeçalho ou vazias
                            if (!line.trim() || line.toUpperCase().includes('CLIENTE') || line.toUpperCase().includes('SPAMOV')) return;

                            let codeFound = null;
                            let unitFound = 'UN';

                            // 1. Encontra possíveis códigos numéricos
                            const possibleNumbers = line.match(/\d+/g) || [];
                            
                            for (let numStr of possibleNumbers) {
                                // Se o número exato está na tabela
                                if (products.some(p => p.code === numStr)) {
                                    codeFound = numStr;
                                    break;
                                }
                                // Se o número termina com um código válido (Ex: no ERP "10628" significa item 10, código 0628)
                                const matchingProduct = products.find(p => numStr.endsWith(p.code) && p.code.length >= 4);
                                if (matchingProduct) {
                                    codeFound = matchingProduct.code;
                                    break;
                                }
                            }

                            if (codeFound) {
                                let qtyFound = 1;
                                
                                // Limpa a linha para isolar quantidades
                                let lineWithoutParens = line.replace(/\([^)]+\)/g, ' ');
                                
                                // Tenta achar x/un/kg/cx/pc explícito (ex: 2 PC, 1 CX)
                                const qtyMatchs = [...lineWithoutParens.matchAll(/\b(\d+(?:[.,]\d+)?)\s*(x|un|kg|cx|pc|pct)\b/gi)];
                                
                                if (qtyMatchs.length > 0) {
                                    const lastMatch = qtyMatchs[qtyMatchs.length - 1];
                                    qtyFound = parseFloat(lastMatch[1].replace(',', '.'));
                                    unitFound = lastMatch[2].toUpperCase();
                                } else {
                                    // Tenta achar apenas a unidade solta no padrão grudado do ERP (ex: 5KgPC)
                                    const unitMatch = line.match(/\b(PC|CX|UN|KG|PCT)\b/i) || line.match(/(PC|CX|UN|KG|PCT)(?=\d|\/|$)/i);
                                    if (unitMatch) unitFound = unitMatch[1].toUpperCase();

                                    // Pega um número solto pequeno que não seja o código ou fim do código
                                    const otherNumbers = lineWithoutParens.match(/\b\d+(?:[.,]\d+)?\b/g)?.filter(n => !n.endsWith(codeFound) && n.length < 4);
                                    if (otherNumbers && otherNumbers.length > 0) {
                                        qtyFound = parseFloat(otherNumbers[0].replace(',', '.'));
                                    }
                                }

                                extractedItems.push({
                                    code: codeFound,
                                    quantity: qtyFound,
                                    unit: unitFound
                                });
                            }
                        });

                        if (extractedItems.length === 0) {
                            setOrderError('Não consegui encontrar nenhum código de produto no texto. Cole o texto completo do ERP.');
                            setIsAnalyzingOrder(false);
                            return;
                        }

                        // Processa os itens cruzando com a tabela em PDF
                        const processedItems = processOrderItems(extractedItems);
                        
                        setOrderSummary({
                            customerCode: customerName,
                            spamov: spamov,
                            items: processedItems,
                            totalOriginal: processedItems.reduce((acc, curr) => acc + curr.originalPrice, 0),
                            totalDiscounted: processedItems.reduce((acc, curr) => acc + curr.discountedPrice, 0)
                        });
                    } catch (err) {
                        console.error(err);
                        setOrderError('Ocorreu um erro ao processar o texto. Verifique o formato.');
                    } finally {
                        setIsAnalyzingOrder(false);
                    }
                }, 300);
            };

            const filteredProducts = useMemo(() => {
                return products.filter(p => 
                    p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    p.code.includes(searchTerm)
                );
            }, [products, searchTerm]);

            return (
                <div className="min-h-screen text-slate-800 p-4 md:p-8 font-sans">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* Navegação */}
                        <div className="flex flex-wrap gap-2 bg-slate-200/60 p-1.5 rounded-xl w-fit">
                            <button 
                                onClick={() => setActiveTab('tabela')}
                                className={`px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 transition-all duration-200 ${activeTab === 'tabela' ? 'bg-white shadow-sm text-emerald-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/80'}`}
                            >
                                <div className="h-4 w-4"><IconFileText /></div>
                                Consulta de Preços (PDF)
                            </button>
                            <button 
                                onClick={() => setActiveTab('resumo')}
                                className={`px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 transition-all duration-200 ${activeTab === 'resumo' ? 'bg-white shadow-sm text-blue-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/80'}`}
                            >
                                <div className="h-4 w-4"><IconReceipt /></div>
                                Resumo de Pedido (IA)
                            </button>
                        </div>

                        {/* ABA 1: PDF */}
                        {activeTab === 'tabela' && (
                            <div className="space-y-6">
                                <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div>
                                        <h1 className="text-2xl md:text-3xl font-bold text-emerald-700 flex items-center gap-2">
                                            <div className="h-8 w-8"><IconFileText /></div>
                                            Consulta Rápida
                                        </h1>
                                        <p className="text-slate-500 mt-1">Primeiro: carregue o PDF do dia para a IA ter a base de preços.</p>
                                    </div>
                                    <div className="flex-shrink-0 w-full md:w-auto relative group">
                                        <input type="file" accept=".pdf" onChange={handleFileUpload} disabled={isLoading || !pdfJsReady} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer disabled:cursor-not-allowed" />
                                        <button disabled={isLoading || !pdfJsReady} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium transition-all flex items-center justify-center gap-2 disabled:bg-slate-300 shadow-sm">
                                            <div className="h-5 w-5">{isLoading ? <IconLoader2 /> : <IconUpload />}</div>
                                            {isLoading ? 'Lendo PDF...' : !pdfJsReady ? 'Aguarde...' : 'Importar PDF'}
                                        </button>
                                    </div>
                                </header>

                                {error && (
                                    <div className="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 flex items-center gap-3">
                                        <div className="h-5 w-5 flex-shrink-0"><IconAlertCircle /></div>
                                        <p>{error}</p>
                                    </div>
                                )}

                                {products.length > 0 && !isLoading && (
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[65vh]">
                                        <div className="p-4 border-b border-slate-200 bg-slate-50">
                                            <div className="relative max-w-xl">
                                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 h-5 w-5"><IconSearch /></div>
                                                <input type="text" placeholder="Pesquise por código ou nome..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 outline-none" />
                                            </div>
                                        </div>
                                        <div className="overflow-auto flex-1">
                                            <table className="w-full text-left border-collapse">
                                                <thead className="bg-white sticky top-0 shadow-sm">
                                                    <tr>
                                                        <th className="p-4 font-semibold text-slate-600 border-b border-slate-200">Código</th>
                                                        <th className="p-4 font-semibold text-slate-600 border-b border-slate-200">Produto</th>
                                                        <th className="p-4 font-semibold text-slate-600 border-b border-slate-200 text-right">Orig.</th>
                                                        <th className="p-4 font-semibold text-emerald-700 border-b border-emerald-200 bg-emerald-50 text-right">À Vista (-3%)</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {filteredProducts.map((product, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100 last:border-0">
                                                            <td className="p-4 text-slate-500">{product.code}</td>
                                                            <td className="p-4 text-slate-800">{product.name}</td>
                                                            <td className="p-4 text-right text-slate-600">{formatPrice(product.originalPrice)}</td>
                                                            <td className="p-4 text-right font-bold text-emerald-700 bg-emerald-50/50">{formatPrice(product.discountedPrice)}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ABA 2: IA */}
                        {activeTab === 'resumo' && (
                            <div className="space-y-6">
                                {}
                                <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col items-start gap-4">
                                    <div className="w-full">
                                        <h1 className="text-2xl md:text-3xl font-bold text-blue-700 flex items-center gap-2">
                                            <div className="h-8 w-8"><IconReceipt /></div>
                                            Leitor de Pedidos (Texto Inteligente)
                                        </h1>
                                        <p className="text-slate-500 mt-1">Cole o pedido copiado (ex: do WhatsApp). O sistema identificará os códigos automaticamente cruzando com o PDF.</p>
                                    </div>
                                    <div className="w-full space-y-3">
                                        <textarea 
                                            value={orderText} 
                                            onChange={(e) => setOrderText(e.target.value)} 
                                            placeholder="Cole aqui o pedido...&#10;&#10;Exemplo:&#10;Cliente: João da Silva&#10;2x 0437&#10;1 cx 1565" 
                                            className="w-full h-40 p-4 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none resize-none font-mono text-sm"
                                            disabled={isAnalyzingOrder || products.length === 0}
                                        ></textarea>
                                        <button 
                                            onClick={handleProcessText}
                                            disabled={isAnalyzingOrder || products.length === 0} 
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-xl font-medium transition-all flex items-center justify-center gap-2 shadow-sm disabled:bg-slate-400"
                                        >
                                            <div className="h-5 w-5">{isAnalyzingOrder ? <IconLoader2 /> : <IconReceipt />}</div>
                                            {isAnalyzingOrder ? 'Processando...' : products.length === 0 ? 'Carregue o PDF de Preços primeiro' : 'Calcular Resumo do Pedido'}
                                        </button>
                                    </div>
                                </header>

                                {orderError && (
                                    <div className="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 flex items-center gap-3">
                                        <div className="h-5 w-5 flex-shrink-0"><IconAlertCircle /></div>
                                        <p>{orderError}</p>
                                    </div>
                                )}

                                {orderSummary && (
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                                            <div className="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                                                <h2 className="font-semibold text-slate-700 text-lg">Cálculo do Pedido (Base no PDF)</h2>
                                                <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2">Cliente: {orderSummary.customerCode}</span>
                                            </div>
                                            <div className="overflow-auto flex-1">
                                                <table className="w-full text-left border-collapse">
                                                    <thead className="bg-white sticky top-0 shadow-sm">
                                                        <tr>
                                                            <th className="p-4 font-semibold text-slate-600 border-b border-slate-200">Qtd</th>
                                                            <th className="p-4 font-semibold text-slate-600 border-b border-slate-200">Produto</th>
                                                            <th className="p-4 font-semibold text-slate-600 border-b border-slate-200 text-right">Unitário</th>
                                                            <th className="p-4 font-semibold text-blue-700 border-b border-blue-200 bg-blue-50 text-right">Subtotal</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {orderSummary.items.map((item, idx) => (
                                                            <tr key={idx} className={`border-b border-slate-100 last:border-0 ${item.notFound ? 'bg-red-50' : 'hover:bg-slate-50'}`}>
                                                                <td className="p-4 font-medium text-slate-500">{item.quantity}x</td>
                                                                <td className="p-4 text-slate-800">
                                                                    <div className="font-medium text-sm text-slate-500 mb-0.5">Cód: {item.code || '-'}</div>
                                                                    {item.name}
                                                                    {item.notFound && (
                                                                        <span className="ml-2 inline-flex items-center gap-1 bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded-full font-medium">
                                                                            <div className="h-3 w-3"><IconAlertTriangle /></div> Não achou no PDF
                                                                        </span>
                                                                    )}
                                                                    {!item.hasDiscount && !item.notFound && (
                                                                        <span className="ml-2 inline-flex items-center gap-1 bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-medium">
                                                                            <div className="h-3 w-3"><IconInfo /></div> S/ desconto aplicado
                                                                        </span>
                                                                    )}
                                                                </td>
                                                                <td className="p-4 text-right text-slate-600">{formatPrice(item.unitFinalPrice)}</td>
                                                                <td className="p-4 text-right font-bold text-blue-700 bg-blue-50/50">{formatPrice(item.discountedPrice)}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                                <h3 className="font-semibold text-slate-700 text-lg mb-4 flex items-center gap-2"><div className="h-5 w-5 text-slate-400"><IconReceipt /></div> Resumo Final</h3>
                                                <div className="space-y-3">
                                                    <div className="flex justify-between items-center text-slate-600"><span>Soma Sem Desconto:</span><span className="font-medium">{formatPrice(orderSummary.totalOriginal)}</span></div>
                                                    <div className="flex justify-between items-center text-emerald-600"><span>Descontos (3%):</span><span className="font-medium">-{formatPrice(orderSummary.totalOriginal - orderSummary.totalDiscounted)}</span></div>
                                                    <div className="pt-3 border-t border-slate-200 flex justify-between items-center"><span className="font-bold text-slate-800">Total a Pagar:</span><span className="text-2xl font-bold text-blue-700">{formatPrice(orderSummary.totalDiscounted)}</span></div>
                                                </div>
                                            </div>

                                            {/* CAIXA DO WHATSAPP */}
                                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="font-semibold text-slate-700 text-lg flex items-center gap-2">
                                                        <div className="h-5 w-5 text-green-600"><IconWhatsApp /></div> Para o WhatsApp
                                                    </h3>
                                                    <button onClick={handleCopyWhatsApp} className="bg-green-100 hover:bg-green-200 text-green-800 px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2">
                                                        Copiar Texto
                                                    </button>
                                                </div>
                                                <pre className="bg-slate-50 p-4 rounded-xl text-sm font-mono text-slate-700 whitespace-pre-wrap border border-slate-200">
                                                    {generateWhatsAppText()}
                                                </pre>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
