<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friganso - Premium ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PDF.js para leitura de PDFs offline -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- FIREBASE (Banco de Dados e Auth) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // INJEÇÃO DA SUA CHAVE DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDaQ-WDQnGi-t5mCvL6rXAWLgO4gxW_j7Y",
            authDomain: "frigansoerm.firebaseapp.com",
            projectId: "frigansoerm",
            storageBucket: "frigansoerm.firebasestorage.app",
            messagingSenderId: "13332928407",
            appId: "1:13332928407:web:b3b51d1b825c560b9016d2",
            measurementId: "G-963SW3XSYM"
        };
        
        // Inicializa o Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ÍCONES SVG
        const IconUser = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconLock = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const IconDashboard = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        const IconUsers = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconShield = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconLogOut = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        const IconMenu = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
        const IconX = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconGoogle = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>;
        const IconFileText = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
        const IconUpload = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconLoader2 = () => <svg className="w-full h-full animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>;
        const IconSearch = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconReceipt = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>;
        const IconTag = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>;
        const IconWhatsApp = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>;
        const IconCheck = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconInfo = () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;

        // FUNÇÕES GLOBAIS DE PREÇO E LIMPEZA
        const normalizeForSearch = (str) => {
            if (!str) return '';
            let s = str.toLowerCase();
            s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
            s = s.replace(/\bcong\.?\b/g, "congelado"); 
            s = s.replace(/\b(resf|ref)\.?\b/g, "resfriado"); 
            s = s.replace(/[-_./]/g, " "); 
            s = s.replace(/\s+/g, " ").trim();
            return s;
        };

        const parsePrice = (priceStr) => {
            if (!priceStr) return null;
            let cleanStr = priceStr;
            if (cleanStr.includes('.') && cleanStr.includes(',')) cleanStr = cleanStr.replace(/\./g, '').replace(',', '.');
            else if (cleanStr.includes(',')) cleanStr = cleanStr.replace(',', '.');
            const val = parseFloat(cleanStr);
            return isNaN(val) ? null : val;
        };

        const formatPrice = (value) => {
            if (value === null || value === undefined) return 'R$ 0,00';
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
        };

        const checkDiscountRules = (code, name, originalPrice) => {
            const codeStr = (code || '').toString().trim();
            const nameStr = (name || '').toLowerCase().trim();
            const origPrice = parseFloat(originalPrice) || 0;
            let hasDiscount = true;
            if (codeStr.startsWith('16') || codeStr.startsWith('27') || codeStr.startsWith('90')) hasDiscount = false;
            if (nameStr.includes('fraldinha ramax')) hasDiscount = false;
            let unitFinalPrice = origPrice;
            if (hasDiscount) unitFinalPrice = Math.round((origPrice * 0.97) * 100) / 100;
            return { hasDiscount, origPrice, unitFinalPrice };
        };

        // CAIXAS DE MENSAGEM CUSTOMIZADAS
        const CustomMessageBox = ({ message, type = 'info', onClose }) => (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-in fade-in">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 flex flex-col items-center text-center zoom-in-95 animate-in">
                    <div className={`h-16 w-16 rounded-full flex items-center justify-center mb-4 ${type === 'error' ? 'bg-red-100 text-red-600' : type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-blue-100 text-blue-600'}`}>
                        {type === 'error' ? <IconX /> : <IconCheck />}
                    </div>
                    <h3 className="text-lg font-bold text-slate-800 mb-2">{type === 'error' ? 'Atenção' : type === 'success' ? 'Sucesso' : 'Aviso'}</h3>
                    <p className="text-slate-600 text-sm mb-6">{message}</p>
                    <button onClick={onClose} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-colors">Entendi</button>
                </div>
            </div>
        );

        // TELAS DO SISTEMA
        const LoginScreen = ({ onLogin, showMessage }) => {
            const [isRegistering, setIsRegistering] = useState(false);
            const [loginCode, setLoginCode] = useState('');
            const [password, setPassword] = useState('');
            const [regName, setRegName] = useState('');
            const [regCode, setRegCode] = useState('');
            const [regEmail, setRegEmail] = useState('');
            const [regPassword, setRegPassword] = useState('');

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&.])[A-Za-z\d@$!%*#?&.]{6,}$/;

            const handleLogin = (e) => {
                e.preventDefault();
                const savedUsers = JSON.parse(window.localStorage.getItem('friganso_users') || '[]');
                // Agora ele busca pelo Código (ID) em vez do e-mail
                let user = savedUsers.find(u => u.code === loginCode && u.password === password);

                if (user) {
                    if (user.code === '99206' && user.role !== 'admin') {
                        user.role = 'admin';
                        const updatedUsers = savedUsers.map(u => u.id === user.id ? user : u);
                        window.localStorage.setItem('friganso_users', JSON.stringify(updatedUsers));
                    }
                    onLogin({ ...user });
                } else {
                    showMessage('Código ou senha incorretos.', 'error');
                }
            };

            const handleGoogleLogin = async () => {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await auth.signInWithPopup(provider);
                    const gUser = result.user;
                    
                    const savedUsers = JSON.parse(window.localStorage.getItem('friganso_users') || '[]');
                    let user = savedUsers.find(u => u.email === gUser.email);
                    
                    if(!user) {
                        user = { id: Date.now(), name: gUser.displayName, code: Math.floor(Math.random() * 90000) + 10000, email: gUser.email, role: 'vendedor', avatar: gUser.photoURL };
                        savedUsers.push(user);
                        window.localStorage.setItem('friganso_users', JSON.stringify(savedUsers));
                    }
                    onLogin(user);
                } catch (error) {
                    showMessage(`Erro no login com Google: ${error.message}`, 'error');
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                if (!passwordRegex.test(regPassword)) {
                    showMessage('A senha deve ter letras, números e caracteres especiais (ex: @, #).', 'error');
                    return;
                }
                const savedUsers = JSON.parse(window.localStorage.getItem('friganso_users') || '[]');
                if (savedUsers.some(u => u.email === regEmail)) { showMessage('Este e-mail já está em uso.', 'error'); return; }
                if (savedUsers.some(u => u.code === regCode)) { showMessage('Este Código já existe.', 'error'); return; }

                const userRole = regCode === '99206' ? 'admin' : 'vendedor';
                const newUser = { id: Date.now(), name: regName, code: regCode, email: regEmail, password: regPassword, role: userRole, avatar: '' };
                
                savedUsers.push(newUser);
                window.localStorage.setItem('friganso_users', JSON.stringify(savedUsers));
                showMessage(userRole === 'admin' ? 'Conta de Admin criada!' : 'Cadastro realizado com sucesso!', 'success');
                setIsRegistering(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden p-4">
                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1607623814075-e51df1bd682f?q=80&w=2000')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-rose-950/80 to-transparent"></div>
                    <div className="w-full max-w-md p-8 glass rounded-3xl shadow-2xl relative z-10 border border-white/10 animate-in fade-in slide-in-from-bottom-4">
                        <div className="flex flex-col items-center mb-8">
                            <div className="h-16 w-16 mb-4 relative">
                                <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-xl" fill="none"><path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" fill="#9f1239" stroke="#fda4af" strokeWidth="3"/></svg>
                            </div>
                            <h1 className="text-3xl font-extrabold text-white">Friganso<span className="text-rose-400 font-light">ERP</span></h1>
                            <p className="text-rose-200 text-sm mt-1">{isRegistering ? 'Crie sua conta' : 'Gestão Inteligente'}</p>
                        </div>

                        {!isRegistering ? (
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"><IconUser/></div><input type="text" value={loginCode} onChange={e => setLoginCode(e.target.value)} className="w-full pl-10 pr-4 py-3.5 bg-white border-0 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-sm font-medium" required placeholder="Seu Código (Ex: 99206)"/></div>
                                <div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"><IconLock/></div><input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-3.5 bg-white border-0 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-sm font-medium" required placeholder="Sua Senha"/></div>
                                <button type="submit" className="w-full bg-rose-700 hover:bg-rose-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-rose-900/50 transition-all">Entrar no Sistema</button>
                                <div className="relative flex py-4 items-center"><div className="flex-grow border-t border-slate-500/30"></div><span className="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium uppercase">Ou</span><div className="flex-grow border-t border-slate-500/30"></div></div>
                                <button type="button" onClick={handleGoogleLogin} className="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold py-3.5 rounded-xl shadow-sm transition-all flex items-center justify-center gap-3"><div className="h-5 w-5"><IconGoogle/></div> Entrar com Google</button>
                                <div className="text-center mt-6"><button type="button" onClick={() => setIsRegistering(true)} className="text-sm font-bold text-rose-300 hover:text-white transition-colors">Novo vendedor? <span className="underline">Criar Cadastro</span></button></div>
                            </form>
                        ) : (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <input type="text" value={regName} onChange={e => setRegName(e.target.value)} className="w-full px-4 py-3 bg-white rounded-xl outline-none text-sm" required placeholder="Nome Completo"/>
                                <input type="text" value={regCode} onChange={e => setRegCode(e.target.value)} className="w-full px-4 py-3 bg-white rounded-xl outline-none text-sm" required placeholder="Cód Vendedor (Ex: 99206)"/>
                                <input type="email" value={regEmail} onChange={e => setRegEmail(e.target.value)} className="w-full px-4 py-3 bg-white rounded-xl outline-none text-sm" required placeholder="E-mail"/>
                                <input type="password" value={regPassword} onChange={e => setRegPassword(e.target.value)} className="w-full px-4 py-3 bg-white rounded-xl outline-none text-sm" required placeholder="Senha Forte (Letras, Num, Especial)"/>
                                <button type="submit" className="w-full bg-rose-700 hover:bg-rose-800 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2">Criar Conta</button>
                                <button type="button" onClick={() => setIsRegistering(false)} className="w-full py-2 text-sm font-bold text-rose-300 hover:text-white mt-2">Voltar</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const PdfScreen = ({ products, setProducts, showMessage }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }, []);

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') { showMessage('Selecione um PDF válido.', 'error'); return; }
                setIsLoading(true);
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let extractedProducts = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const linesMap = new Map();
                        textContent.items.forEach(item => {
                            const y = Math.round(item.transform[5] / 4) * 4; 
                            if (!linesMap.has(y)) linesMap.set(y, []);
                            linesMap.get(y).push(item);
                        });
                        const sortedY = Array.from(linesMap.keys()).sort((a, b) => b - a);
                        sortedY.forEach(y => {
                            const lineItems = linesMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
                            const lineText = lineItems.map(item => item.str).join(' ').replace(/\s+/g, ' ').trim();
                            const match = lineText.match(/(?:^|\s)(\d{4,7})\s+([A-Z0-9ÇÃÕÁÉÍÓÚÂÊÔ].*)/i);
                            if (match) {
                                const code = match[1];
                                let rest = match[2].trim();
                                let rawPriceStr = null;
                                rest = rest.replace(/\s+Kg\s*\[L\].*$/i, '');
                                rest = rest.replace(/(?:\s+\d{1,5}[.,]\d{2}){2,}.*$/g, '');
                                rest = rest.replace(/\s+(?:UN|KG|CX|PC|PCT|BD|PLT|FD|KL|KIL|L|K|KgL|Ke|IN|F|Th|M|\[L\])\s*$/gi, '');
                                rest = rest.replace(/[-—.,]+\s*$/, '').trim();
                                const priceMatches = [...rest.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2}|\d+\.\d{2})/g)];
                                if (priceMatches.length > 0) {
                                    rawPriceStr = priceMatches[priceMatches.length - 1][1];
                                    const lastPrice = priceMatches[priceMatches.length - 1][0];
                                    const lastIndex = rest.lastIndexOf(lastPrice);
                                    if(lastIndex !== -1) rest = rest.substring(0, lastIndex);
                                }
                                const rawPrice = parsePrice(rawPriceStr);
                                const { hasDiscount, unitFinalPrice } = checkDiscountRules(code, rest, rawPrice);
                                extractedProducts.push({ code, name: rest, originalPrice: rawPrice, discountedPrice: unitFinalPrice });
                            }
                        });
                    }
                    setProducts(extractedProducts);
                    showMessage(`Sucesso! ${extractedProducts.length} produtos lidos.`, 'success');
                } catch (err) { showMessage('Erro ao processar PDF.', 'error'); } finally { setIsLoading(false); }
            };

            const filteredProducts = useMemo(() => {
                if (!searchTerm) return products;
                const searchNorm = normalizeForSearch(searchTerm);
                return products.filter(p => normalizeForSearch(p.name).includes(searchNorm) || p.code.includes(searchNorm));
            }, [products, searchTerm]);

            return (
                <div className="animate-in fade-in space-y-6 max-w-5xl mx-auto">
                    <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-rose-800 flex items-center gap-2"><div className="h-6 w-6"><IconFileText /></div> Base de Preços</h1>
                            <p className="text-slate-500 text-sm mt-1">Carregue o PDF atualizado para o sistema reconhecer os pedidos.</p>
                        </div>
                        <div className="relative">
                            <input type="file" accept=".pdf" onChange={handleFileUpload} disabled={isLoading} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                            <button disabled={isLoading} className="bg-rose-700 hover:bg-rose-800 text-white px-6 py-3 rounded-xl font-bold transition-all flex items-center gap-2">
                                <div className="h-5 w-5">{isLoading ? <IconLoader2 /> : <IconUpload />}</div>
                                {isLoading ? 'Lendo PDF...' : 'Importar Novo PDF'}
                            </button>
                        </div>
                    </header>
                    {products.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[60vh]">
                            <div className="p-4 border-b border-slate-200 bg-slate-50 relative">
                                <div className="absolute left-7 top-1/2 -translate-y-1/2 text-slate-400 h-5 w-5"><IconSearch /></div>
                                <input type="text" placeholder="Pesquise por código ou nome..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 focus:border-rose-500 outline-none" />
                            </div>
                            <div className="overflow-auto flex-1">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-white sticky top-0 shadow-sm">
                                        <tr>
                                            <th className="p-4 font-bold text-slate-600 border-b">Cód</th>
                                            <th className="p-4 font-bold text-slate-600 border-b">Produto</th>
                                            <th className="p-4 font-bold text-slate-600 border-b text-right">Orig.</th>
                                            <th className="p-4 font-bold text-rose-700 border-b bg-rose-50 text-right">À Vista (-3%)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredProducts.map((p, i) => (
                                            <tr key={i} className="hover:bg-slate-50 border-b border-slate-100">
                                                <td className="p-4 text-slate-500 font-bold">{p.code}</td>
                                                <td className="p-4 text-slate-800">{p.name}</td>
                                                <td className="p-4 text-right text-slate-600">{formatPrice(p.originalPrice)}</td>
                                                <td className="p-4 text-right font-bold text-rose-700 bg-rose-50/30">{formatPrice(p.discountedPrice)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ResumoScreen = ({ products, showMessage }) => {
            const [orderText, setOrderText] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [pendingCustomer, setPendingCustomer] = useState('');
            const [pendingSpamov, setPendingSpamov] = useState('');
            const [pendingItems, setPendingItems] = useState([]);
            const [orderSummary, setOrderSummary] = useState(null);

            const handleProcessText = () => {
                if (products.length === 0) { showMessage('Carregue o PDF primeiro!', 'error'); return; }
                if (!orderText.trim()) { showMessage('Cole o texto do pedido.', 'error'); return; }
                try {
                    let customerName = '', spamov = '';
                    const spMatch = orderText.match(/SPAmov[:\-\s]*(\d+)/i);
                    if (spMatch) spamov = spMatch[1];
                    const clienteMatchNormal = orderText.match(/(?:cliente|código|codigo)[:\-\s]+(\d+)/i);
                    if (clienteMatchNormal) customerName = clienteMatchNormal[1].trim();

                    let extractedItemsMap = new Map();
                    const lines = orderText.split('\n');
                    
                    lines.forEach(line => {
                        if (!line.trim() || line.toUpperCase().includes('CLIENTE') || line.toUpperCase().includes('SPAMOV')) return;
                        const cleanLine = line.replace(/\([^)]+\)/g, ' ').trim();
                        
                        let codeFound = null;
                        const possibleNumbers = cleanLine.match(/\d+/g) || [];
                        for (let numStr of possibleNumbers) {
                            if (products.some(p => p.code === numStr)) { codeFound = numStr; break; }
                        }
                        
                        if (codeFound && !extractedItemsMap.has(codeFound)) {
                            const realProduct = products.find(p => p.code === codeFound);
                            extractedItemsMap.set(codeFound, { code: codeFound, name: realProduct.name, quantity: '' });
                        }
                    });

                    if (extractedItemsMap.size === 0) { showMessage('Nenhum código válido encontrado.', 'error'); return; }
                    
                    setPendingCustomer(customerName);
                    setPendingSpamov(spamov);
                    setPendingItems(Array.from(extractedItemsMap.values()));
                    setShowModal(true);
                } catch (err) { showMessage('Erro ao processar texto.', 'error'); }
            };

            const handleConfirmModal = () => {
                const validItems = pendingItems.filter(item => Number(item.quantity) > 0);
                const processed = validItems.map(item => {
                    const rp = products.find(p => p.code === item.code);
                    const { hasDiscount, origPrice, unitFinalPrice } = checkDiscountRules(item.code, rp.name, rp.originalPrice);
                    const qty = Number(item.quantity);
                    return { ...item, quantity: qty, unitFinalPrice, discountedPrice: unitFinalPrice * qty, originalPrice: origPrice * qty, hasDiscount };
                });
                setOrderSummary({ customerCode: pendingCustomer, spamov: pendingSpamov, items: processed, totalDiscounted: processed.reduce((acc, c) => acc + c.discountedPrice, 0) });
                setShowModal(false);
            };

            const handleCopyWhatsApp = () => {
                let txt = '';
                if (orderSummary.customerCode) txt += `cliente: ${orderSummary.customerCode}\n`;
                if (orderSummary.spamov) txt += `spamov: ${orderSummary.spamov}\n`;
                if (txt !== '') txt += '\n';
                orderSummary.items.forEach(i => { txt += `${i.code} - ${i.quantity} - ${formatPrice(i.unitFinalPrice)}\n`; });
                navigator.clipboard.writeText(txt.trim());
                showMessage('Copiado para o WhatsApp!', 'success');
            };

            return (
                <div className="animate-in fade-in space-y-6 max-w-5xl mx-auto">
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[80vh] overflow-hidden">
                                <div className="p-6 border-b bg-slate-50"><h2 className="text-xl font-bold text-slate-800">Confirme as Quantidades</h2></div>
                                <div className="p-6 overflow-y-auto flex-1 space-y-4">
                                    {pendingItems.map((item, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-4 rounded-xl border border-slate-200">
                                            <div><span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">CÓD: {item.code}</span><p className="font-bold text-slate-800 mt-1">{item.name}</p></div>
                                            <input type="number" min="0" value={item.quantity} onChange={(e) => { const n = [...pendingItems]; n[idx].quantity = e.target.value; setPendingItems(n); }} className="w-24 p-3 text-center border border-slate-300 rounded-xl outline-none focus:border-rose-500 font-bold" placeholder="Qtd"/>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 border-t flex gap-3 justify-end bg-slate-50">
                                    <button onClick={() => setShowModal(false)} className="px-6 py-3 font-bold text-slate-600 hover:bg-slate-200 rounded-xl">Cancelar</button>
                                    <button onClick={handleConfirmModal} className="px-6 py-3 font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl">Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                        <h2 className="text-xl font-bold text-rose-800 mb-4 flex items-center gap-2"><div className="h-6 w-6"><IconReceipt /></div> Leitor de Texto (WhatsApp/ERP)</h2>
                        <textarea value={orderText} onChange={e => setOrderText(e.target.value)} placeholder="Cole o texto bruto do pedido aqui..." className="w-full h-40 p-4 rounded-xl border border-slate-200 focus:border-rose-500 outline-none resize-none font-mono text-sm mb-4"></textarea>
                        <button onClick={handleProcessText} className="w-full bg-rose-700 hover:bg-rose-800 text-white py-4 rounded-xl font-bold">Localizar Códigos</button>
                    </div>

                    {orderSummary && !showModal && (
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-lg font-bold text-slate-800">Resumo Calculado</h3>
                                <button onClick={handleCopyWhatsApp} className="bg-green-100 text-green-700 px-4 py-2 rounded-xl font-bold flex items-center gap-2"><div className="h-4 w-4"><IconWhatsApp/></div> Copiar ZAP</button>
                            </div>
                            <div className="space-y-3 mb-6">
                                {orderSummary.items.map((i, idx) => (
                                    <div key={idx} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <div className="font-mono text-sm font-bold text-slate-600">{i.code} <span className="mx-2 text-slate-400">|</span> {i.quantity}x</div>
                                        <div className="font-bold text-rose-700">{formatPrice(i.discountedPrice)}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="border-t pt-4 flex justify-between items-center">
                                <span className="font-bold text-slate-500 uppercase tracking-widest text-sm">Total Final</span>
                                <span className="text-2xl font-black text-rose-800">{formatPrice(orderSummary.totalDiscounted)}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const OrcamentosScreen = ({ products, showMessage }) => {
            const [search, setSearch] = useState('');
            const [selectedCodes, setSelectedCodes] = useState(new Set());

            const filtered = useMemo(() => {
                if (!search.trim()) return [];
                const norm = normalizeForSearch(search);
                return products.filter(p => normalizeForSearch(p.name).includes(norm) || p.code.includes(norm));
            }, [products, search]);

            const toggleCode = code => { const s = new Set(selectedCodes); s.has(code) ? s.delete(code) : s.add(code); setSelectedCodes(s); };
            const toggleAll = () => { selectedCodes.size === filtered.length ? setSelectedCodes(new Set()) : setSelectedCodes(new Set(filtered.map(p=>p.code))); };

            const generateText = () => {
                if(selectedCodes.size === 0) return '';
                let txt = search.trim() ? `🥩 *${search.toUpperCase()}*\n\n` : `🥩 *ORÇAMENTO*\n\n`;
                products.filter(p => selectedCodes.has(p.code)).forEach(p => {
                    const { hasDiscount, origPrice, unitFinalPrice } = checkDiscountRules(p.code, p.name, p.originalPrice);
                    txt += `Cod: ${p.code}\n\n${p.name}\n`;
                    if(hasDiscount) txt += `💰 Valor: ~${formatPrice(origPrice)}~ por *${formatPrice(unitFinalPrice)}/kg* 🔥 (Com 3% de Desconto)\n\n`;
                    else txt += `💰 Valor: *${formatPrice(origPrice)}/kg*\n\n`;
                });
                return txt.trim();
            };

            const copyZap = () => { navigator.clipboard.writeText(generateText()); showMessage('Orçamento copiado!', 'success'); };

            return (
                <div className="animate-in fade-in space-y-6 max-w-6xl mx-auto">
                    <header className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                        <h1 className="text-2xl font-bold text-rose-800 flex items-center gap-2 mb-4"><div className="h-6 w-6"><IconTag /></div> Orçamentos Rápidos</h1>
                        <div className="relative"><div className="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"><IconSearch/></div><input type="text" placeholder="Busque a carne (ex: contra file, picanha)..." value={search} onChange={e=>setSearch(e.target.value)} disabled={products.length===0} className="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 outline-none focus:border-rose-500 font-bold"/></div>
                    </header>
                    {search && filtered.length > 0 && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white rounded-3xl border border-slate-200 flex flex-col h-[600px] overflow-hidden">
                                <div className="p-4 border-b bg-slate-50 flex justify-between items-center">
                                    <h2 className="font-bold text-slate-700">Selecione</h2>
                                    <button onClick={toggleAll} className="text-sm font-bold text-rose-600 bg-rose-50 px-3 py-1 rounded-lg">Marcar Todos</button>
                                </div>
                                <div className="overflow-y-auto p-2 space-y-1">
                                    {filtered.map(p => (
                                        <label key={p.code} className={`flex gap-3 p-4 rounded-xl cursor-pointer border-2 transition-all ${selectedCodes.has(p.code) ? 'border-rose-500 bg-rose-50/50' : 'border-transparent hover:bg-slate-50'}`}>
                                            <input type="checkbox" checked={selectedCodes.has(p.code)} onChange={()=>toggleCode(p.code)} className="mt-1 h-5 w-5 text-rose-600 rounded"/>
                                            <div><span className="text-xs font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded">Cód: {p.code}</span><p className="font-bold text-slate-800 text-sm mt-1">{p.name}</p></div>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-white rounded-3xl border border-slate-200 flex flex-col h-[600px] overflow-hidden">
                                <div className="p-4 border-b bg-slate-50 flex justify-between items-center">
                                    <h2 className="font-bold text-slate-700">Preview</h2>
                                    <button onClick={copyZap} disabled={selectedCodes.size===0} className="bg-green-100 text-green-700 px-4 py-1.5 rounded-lg font-bold flex gap-2"><div className="h-4 w-4"><IconWhatsApp/></div> Copiar</button>
                                </div>
                                <div className="p-6 bg-slate-100 flex-1 overflow-y-auto">
                                    {selectedCodes.size > 0 ? <pre className="bg-white p-4 rounded-2xl shadow-sm font-mono text-sm whitespace-pre-wrap text-slate-700">{generateText()}</pre> : <p className="text-center text-slate-400 mt-10 font-bold">Nenhum produto selecionado</p>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CrmScreen = ({ showMessage }) => {
            const [step, setStep] = useState(1);
            const [client, setClient] = useState({ name: '', phone: '', code: '', cep: '' });
            const [answers, setAnswers] = useState(Array(20).fill(3));
            
            const questions = [
                "1. O cliente gosta de comprar e cortar peças inteiras (Banda/Dianteiro)?",
                "2. O cliente prefere comprar caixarias já padronizadas?",
                "3. O cliente costuma comprar boi no osso?",
                "4. Ele possui uma seção forte de frios (mortadela, queijo)?",
                "5. Ele trabalha com venda direta ao consumidor final (balcão)?",
                "6. Ele possui cozinha industrial ou serve refeições?",
                "7. O cliente compra grandes volumes de carne de segunda para moer?",
                "8. Ele exige cortes com alto padrão de acabamento (gourmet)?",
                "9. O estabelecimento tem gôndolas de mercearia além das carnes?",
                "10. O foco de venda dele são pratos feitos (PF) ou marmitex?",
                "11. Ele faz pedidos diários de reposição rápida?",
                "12. Ele compra suínos em carcaça?",
                "13. O cliente utiliza embutidos para preparar lanches ou pizzas?",
                "14. Ele tem estrutura própria para desossa pesada?",
                "15. O cliente foca em carnes resfriadas em vez de congeladas?",
                "16. Ele possui câmara fria de grande porte?",
                "17. Ele atende público de churrasco (compra carvão, pão de alho)?",
                "18. Ele costuma chorar preço em cortes populares (acém, paleta)?",
                "19. Ele tem cardápio fixo que depende de um corte específico sempre?",
                "20. A fachada do local indica ser uma 'Casa de Carnes' tradicional?"
            ];

            const analyzeProfile = () => {
                let pAcougue = answers[0] + answers[2] + answers[4] + answers[11] + answers[13] + answers[14] + answers[16] + answers[19];
                let pRestaurante = answers[1] + answers[5] + answers[9] + answers[12] + answers[18];
                let pMercado = answers[3] + answers[6] + answers[8] + answers[10] + answers[15] + answers[17];

                if (pAcougue > pRestaurante && pAcougue > pMercado) {
                    if (answers[3] > 3) return "Açougue Completo (Com Frios/Mercearia)";
                    if (answers[2] > 3) return "Açougue Raiz (Boi no Osso / Desossa)";
                    return "Casa de Carnes Padrão";
                } else if (pRestaurante > pAcougue && pRestaurante > pMercado) {
                    if (answers[7] > 3) return "Restaurante Alta Gastronomia / Churrascaria";
                    return "Restaurante Comercial / Marmitaria (Foco Caixaria)";
                } else {
                    if (pAcougue > 25) return "Supermercado com Açougue Forte";
                    return "Minimercado / Mercearia (Foco Embutidos)";
                }
            };

            const handleSave = () => {
                const profile = analyzeProfile();
                showMessage(`Cliente salvo com sucesso! Perfil identificado: ${profile}`, 'success');
                setStep(1); setClient({ name: '', phone: '', code: '', cep: '' }); setAnswers(Array(20).fill(3));
            };

            return (
                <div className="animate-in fade-in space-y-6 max-w-3xl mx-auto">
                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                        <h2 className="text-2xl font-bold text-rose-800 mb-6">Cadastro Inteligente de Cliente</h2>
                        {step === 1 ? (
                            <div className="space-y-4">
                                <input type="text" placeholder="Nome Fantasia / Razão" value={client.name} onChange={e=>setClient({...client, name: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:border-rose-500 font-bold text-slate-700"/>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" placeholder="Código SPAmov" value={client.code} onChange={e=>setClient({...client, code: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:border-rose-500 font-bold text-slate-700"/>
                                    <input type="text" placeholder="Telefone / WhatsApp" value={client.phone} onChange={e=>setClient({...client, phone: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:border-rose-500 font-bold text-slate-700"/>
                                </div>
                                <input type="text" placeholder="CEP / Endereço Completo" value={client.cep} onChange={e=>setClient({...client, cep: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:border-rose-500 font-bold text-slate-700"/>
                                <button onClick={() => setStep(2)} className="w-full bg-rose-700 text-white font-bold py-4 rounded-xl mt-4">Próximo: Perfilamento de Venda</button>
                            </div>
                        ) : (
                            <div className="space-y-8">
                                <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-amber-800 text-sm font-bold">
                                    Responda a escala para a IA identificar o perfil exato do cliente.<br/> 1 = Raramente/Discordo totalmente | 5 = Muito Frequente/Concordo
                                </div>
                                {questions.map((q, i) => (
                                    <div key={i} className="border-b border-slate-100 pb-4">
                                        <p className="font-bold text-slate-700 mb-3">{q}</p>
                                        <div className="flex justify-between max-w-sm gap-2">
                                            {[1,2,3,4,5].map(val => (
                                                <button key={val} onClick={() => { const a = [...answers]; a[i] = val; setAnswers(a); }} className={`flex-1 h-10 rounded-lg font-bold transition-all ${answers[i] === val ? 'bg-rose-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                                    {val}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                <div className="flex gap-4 pt-4">
                                    <button onClick={() => setStep(1)} className="flex-1 py-4 font-bold text-slate-500 bg-slate-100 rounded-xl">Voltar</button>
                                    <button onClick={handleSave} className="flex-[2] py-4 font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-lg">Salvar e Analisar Perfil</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(() => { const s = window.localStorage.getItem('friganso_loggedUser'); return s ? JSON.parse(s) : null; });
            const [activeRoute, setActiveRoute] = useState('pdf');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [messageBox, setMessageBox] = useState(null);
            
            // Estado Global do PDF para ser compartilhado entre as telas
            const [products, setProducts] = useState([]);

            const handleSetUser = (userData) => {
                if (userData) window.localStorage.setItem('friganso_loggedUser', JSON.stringify(userData));
                else window.localStorage.removeItem('friganso_loggedUser');
                setUser(userData);
            };

            const showMessage = (message, type = 'info') => setMessageBox({ message, type });

            if (!user) {
                return (
                    <>
                        <LoginScreen onLogin={handleSetUser} showMessage={showMessage} />
                        {messageBox && <CustomMessageBox {...messageBox} onClose={() => setMessageBox(null)} />}
                    </>
                );
            }

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden font-sans">
                    {messageBox && <CustomMessageBox {...messageBox} onClose={() => setMessageBox(null)} />}

                    {/* Menu Mobile Toggle */}
                    <button className="md:hidden fixed top-4 left-4 z-50 p-2 bg-slate-900 text-white rounded-lg" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>
                        <div className="h-6 w-6"><IconMenu/></div>
                    </button>

                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-72 bg-slate-950 text-slate-300 transform transition-transform duration-300 flex flex-col ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 md:static border-r border-slate-800`}>
                        <div className="p-6 border-b border-slate-800 flex items-center gap-4 bg-rose-950/30">
                            <div className="h-10 w-10 relative"><svg viewBox="0 0 100 100" fill="none"><path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" fill="#be123c"/></svg></div>
                            <div><h1 className="text-xl font-black text-white tracking-tight">FRIGANSO</h1><p className="text-[10px] text-rose-500 uppercase font-bold tracking-widest">Premium ERP</p></div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-2 mt-4">
                            <button onClick={() => { setActiveRoute('pdf'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all ${activeRoute === 'pdf' ? 'bg-rose-700 text-white shadow-md' : 'hover:bg-slate-800'}`}><div className="h-5 w-5"><IconFileText/></div> Consulta PDF</button>
                            <button onClick={() => { setActiveRoute('resumo'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all ${activeRoute === 'resumo' ? 'bg-rose-700 text-white shadow-md' : 'hover:bg-slate-800'}`}><div className="h-5 w-5"><IconReceipt/></div> Leitor de Pedidos</button>
                            <button onClick={() => { setActiveRoute('orcamentos'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all ${activeRoute === 'orcamentos' ? 'bg-rose-700 text-white shadow-md' : 'hover:bg-slate-800'}`}><div className="h-5 w-5"><IconTag/></div> Gerar Orçamentos</button>
                            <button onClick={() => { setActiveRoute('crm'); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all ${activeRoute === 'crm' ? 'bg-rose-700 text-white shadow-md' : 'hover:bg-slate-800'}`}><div className="h-5 w-5"><IconUsers/></div> CRM & Rotas</button>
                        </div>

                        <div className="p-4 border-t border-slate-800 bg-slate-900">
                            <div className="flex items-center gap-3 p-2 mb-2">
                                <div className="h-10 w-10 rounded-full bg-rose-700 text-white flex items-center justify-center font-bold shadow-md overflow-hidden">{user.avatar ? <img src={user.avatar}/> : user.name.charAt(0)}</div>
                                <div className="flex-1 overflow-hidden"><p className="text-sm font-bold text-white truncate">{user.name}</p><p className="text-[10px] text-slate-500 font-bold uppercase truncate">CÓD: {user.code} | {user.role}</p></div>
                            </div>
                            <button onClick={() => handleSetUser(null)} className="w-full flex items-center justify-center gap-2 py-2 text-sm font-bold text-slate-400 hover:text-rose-400 rounded-lg transition-colors"><div className="h-4 w-4"><IconLogOut/></div> Sair da Conta</button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 overflow-y-auto p-4 pt-16 md:p-8 bg-slate-100/50 relative">
                        {/* Imagem de Fundo Friganso (Marcad'agua Suave) */}
                        <div className="absolute inset-0 pointer-events-none opacity-[0.03] bg-[url('https://images.unsplash.com/photo-1607623814075-e51df1bd682f?q=80&w=2000')] bg-cover bg-center"></div>
                        
                        <div className="relative z-10">
                            {activeRoute === 'pdf' && <PdfScreen products={products} setProducts={setProducts} showMessage={showMessage} />}
                            {activeRoute === 'resumo' && <ResumoScreen products={products} showMessage={showMessage} />}
                            {activeRoute === 'orcamentos' && <OrcamentosScreen products={products} showMessage={showMessage} />}
                            {activeRoute === 'crm' && <CrmScreen showMessage={showMessage} />}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
